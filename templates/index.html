<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h1 class="text-center">Iris Flower Classification</h1>
            </div>
            <div class="card-body">
                <p class="text-center">This application uses a machine learning model trained on the famous Iris dataset to predict the species of an iris flower based on 4 flower measurements.</p>
                <form method="POST" class="row g-3">
                    <div class="col-md-6">
                        <label for="sepal_length" class="form-label">Sepal Length:</label>
                        <input type="text" class="form-control" id="sepal_length" name="sepal_length" required>
                    </div>
                    <div class="col-md-6">
                        <label for="sepal_width" class="form-label">Sepal Width:</label>
                        <input type="text" class="form-control" id="sepal_width" name="sepal_width" required>
                    </div>
                    <div class="col-md-6">
                        <label for="petal_length" class="form-label">Petal Length:</label>
                        <input type="text" class="form-control" id="petal_length" name="petal_length" required>
                    </div>
                    <div class="col-md-6">
                        <label for="petal_width" class="form-label">Petal Width:</label>
                        <input type="text" class="form-control" id="petal_width" name="petal_width" required>
                    </div>
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary">Predict</button>
                    </div>
                </form>
                {% if prediction %}
                    <div class="alert alert-success mt-4 text-center">
                        <h2>Predicted Species: {{ prediction }}</h2>
                        <p><strong>Description:</strong> {{ description }}</p>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
