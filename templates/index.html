<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iris Classifier</title>
</head>
<body>
  <h1>Iris Flower Predictor</h1>
  <p>Enter flower measurements to predict its species using machine learning.</p>

  <form id="iris-form">
    <label>Sepal Length:</label><input type="number" step="any" id="sepal_length" required><br>
    <label>Sepal Width:</label><input type="number" step="any" id="sepal_width" required><br>
    <label>Petal Length:</label><input type="number" step="any" id="petal_length" required><br>
    <label>Petal Width:</label><input type="number" step="any" id="petal_width" required><br>
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>

  <script src="/static/main.js"></script>
</body>
</html>
