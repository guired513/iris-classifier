<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iris Classifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <div class="text-center mb-4">
          <h1 class="display-5">🌸 Iris Flower Classifier</h1>
          <p class="lead">Enter flower measurements to predict its species using machine learning.</p>
        </div>

        <form id="iris-form" class="card p-4 shadow-sm bg-white">
          <div class="mb-3">
            <label class="form-label">Sepal Length (cm)</label>
            <input type="number" class="form-control" id="sepal_length" step="any" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Sepal Width (cm)</label>
            <input type="number" class="form-control" id="sepal_width" step="any" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Petal Length (cm)</label>
            <input type="number" class="form-control" id="petal_length" step="any" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Petal Width (cm)</label>
            <input type="number" class="form-control" id="petal_width" step="any" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Predict</button>
          </div>
        </form>

        <div id="result" class="mt-4 text-center"></div>

      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-3">
    <small>Powered by Flask + scikit-learn · Trained on the Iris Dataset</small>
  </footer>

  <script src="/static/main.js"></script>
</body>
</html>
